# This is a basic workflow to help you get started with Actions

name: Test and release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "App version name, for example 1.2.0"
        type: string
        required: true
        default: "1.0.0"
      buildType:
        description: "Build type"
        type: choice
        required: true
        default: "debug"
        options:
          - debug
          - release

jobs:
  unit-tests:
    name: Run Android unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        
  build-android:
    name: Build Android APK
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        
      - name: Decode release keystore
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build debug APK
        if: ${{ github.event.inputs.buildType == 'debug' }}
        run: ./gradlew assembleDebug -PbuildVersionName="${{ github.event.inputs.versionName }}"

      - name: Build release APK
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: ./gradlew assembleRelease -PbuildVersionName="${{ github.event.inputs.versionName }}"
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload debug APK
        if: ${{ github.event.inputs.buildType == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.event.inputs.versionName }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ github.event.inputs.buildType == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.event.inputs.versionName }}
          path: app/build/outputs/apk/release/*.apk
